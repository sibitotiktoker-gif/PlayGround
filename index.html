<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercadinho do Seu Zé</title>
<style>
:root{--ink:#292d3e;--cream:#fff4d6;--paper:#fffaf0;--green:#287a57;--gold:#efb44d;--red:#cf5b52;--blue:#4d78a8}
*{box-sizing:border-box} body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:#b9d7cd;color:var(--ink);overflow:hidden}
.game{height:100vh;display:grid;grid-template-rows:62px minmax(260px,58%) 1fr}
header{background:#2d5a48;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;border-bottom:5px solid #1e4235}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;background:var(--gold);border:3px solid #fff0b8;display:grid;place-items:center;box-shadow:4px 4px 0 #17372b}.logo i{width:20px;height:16px;background:#fff5dc;border:3px solid #784a32;display:block}.brand h1{font-size:19px;margin:0}.brand small{display:block;color:#bfe1cf;margin-top:2px}.stats{display:flex;gap:8px}.stat{background:#f7edcf;color:#26352f;border:3px solid #18372c;min-width:106px;padding:5px 9px;font-weight:900;font-size:13px;box-shadow:3px 3px 0 #18372c}.stat b{display:block;font-size:16px;color:#1e6548}.scene{position:relative;overflow:hidden;background:linear-gradient(#82c4cf 0 18%,#dfc68a 18% 100%);border-bottom:5px solid #4b4a3e}
.wall{position:absolute;inset:18% 0 0;background:repeating-linear-gradient(90deg,#ecd9a4 0 56px,#dfc891 56px 59px)}
.awning{position:absolute;top:18%;left:0;right:0;height:42px;background:repeating-linear-gradient(90deg,#bf5148 0 44px,#fff0c5 44px 88px);border-top:5px solid #73433a;border-bottom:5px solid #73433a}
.sign{position:absolute;top:8%;left:50%;transform:translateX(-50%);background:#fff1c4;border:5px solid #3a5a47;padding:5px 18px;color:#9c4c40;font-weight:900;font-size:18px;box-shadow:5px 5px 0 #647568}
.store{position:absolute;left:5%;right:5%;bottom:8%;height:55%;border:7px solid #4a4a3d;background:#cbbf91;box-shadow:inset 0 8px 0 #e9dcae}
.backwall{position:absolute;left:0;right:0;top:0;height:54%;background:linear-gradient(#9ec1a9 0 8px,#d6ca9a 8px)}
.shelf{position:absolute;bottom:0;width:26%;height:66px;background:#866247;border:5px solid #584330;box-shadow:0 6px 0 #3e3228}.shelf1{left:3%}.shelf2{right:3%}.shelf:before,.shelf:after{content:"";position:absolute;left:5px;right:5px;height:5px;background:#ead89d}.shelf:before{top:18px}.shelf:after{bottom:17px}
.items{position:absolute;inset:0}.item{position:absolute;width:10px;height:16px;border:2px solid #684835}.item:nth-child(1){left:8%;top:28%;background:#efce58}.item:nth-child(2){left:15%;top:29%;background:#d85d51}.item:nth-child(3){left:23%;top:26%;background:#78a95c}.item:nth-child(4){left:64%;top:29%;background:#5c9bbb}.item:nth-child(5){left:72%;top:27%;background:#e6b44d}.item:nth-child(6){left:80%;top:29%;background:#ce6d58}.item:nth-child(7){left:88%;top:26%;background:#799d58}
.counter{position:absolute;right:29%;bottom:-4px;width:31%;height:78px;background:#9d6041;border:6px solid #5c402f}.counter:before{content:"CAIXA";position:absolute;left:18%;top:-27px;background:#f0dfae;border:4px solid #60472f;color:#60472f;font-weight:900;padding:3px 8px}.register{position:absolute;width:50px;height:35px;left:10px;top:-32px;background:#ddd4b2;border:5px solid #555;transform:skew(-8deg)}
.cart{position:absolute;left:34%;bottom:-1px;width:85px;height:45px;border:5px solid #546675;border-top-width:10px}.cart:before,.cart:after{content:"";position:absolute;bottom:-15px;width:14px;height:14px;border-radius:50%;background:#3d4144}.cart:before{left:10px}.cart:after{right:10px}.basket{position:absolute;left:10px;top:-28px;width:25px;height:22px;background:#e0ad55;border:3px solid #795f39}
.person{position:absolute;bottom:20%;width:74px;height:126px;z-index:4}.mentor{left:12%}.head{position:absolute;left:17px;top:0;width:46px;height:46px;background:#dba77d;border:4px solid #62483b}.head:before{content:"";position:absolute;width:46px;height:18px;left:-4px;top:-4px;background:#f1ead8;border:4px solid #62483b}.face{position:absolute;width:34px;height:11px;left:2px;bottom:3px;border-top:5px solid #684b38}.glasses{position:absolute;width:10px;height:8px;border:3px solid #4a4a42;left:2px;top:17px;box-shadow:18px 0 0 -3px #dba77d,18px 0 0 0 #4a4a42}.body{position:absolute;left:10px;top:42px;width:56px;height:64px;background:#f4efdc;border:4px solid #60483b}.tie{position:absolute;left:24px;top:0;width:14px;height:34px;background:#b64f43;border:3px solid #60483b}.legs{position:absolute;left:12px;top:102px;width:52px;height:24px;background:#58778d;border:4px solid #4c4a43}.arms{position:absolute;left:-8px;top:48px;width:72px;height:15px;border-top:12px solid #f4efdc;border-left:8px solid transparent;border-right:8px solid transparent}.thought{position:absolute;left:74px;top:-25px;width:190px;background:#fffdf2;border:4px solid #4a4a3e;padding:8px 10px;font-size:12px;font-weight:900;box-shadow:4px 4px 0 #8b866f}.thought:after{content:"";position:absolute;left:-14px;bottom:-4px;border:8px solid transparent;border-right:8px solid #fffdf2}
.customer{right:11%;bottom:13%;width:64px;height:108px}.customer .head{width:40px;height:42px;left:11px}.customer .body{left:8px;top:38px;width:48px;height:54px;background:#6380a4}.customer .legs{left:10px;top:88px;width:44px;height:20px;background:#4c4d55}.customer .body:before{content:"";position:absolute;width:56px;height:14px;background:#e9b06f;left:-8px;top:20px}.bubble{position:absolute;right:4%;bottom:42%;background:#fff;border:4px solid #4a4a3e;padding:7px;font-size:11px;font-weight:bold}
.bottom{display:grid;grid-template-columns:220px 1fr 290px;min-height:0;background:var(--paper);overflow:hidden}.sidebar{border-right:4px solid #5d5a4b;padding:10px;background:#eee7d2}.sidebar h3,.panel h3,.tasks h3{margin:0 0 8px;font-size:14px;text-transform:uppercase}.navbtn{display:block;width:100%;text-align:left;border:3px solid #817b65;background:#fff8e7;margin:5px 0;padding:8px 9px;font-weight:900;color:#4d4b41;cursor:pointer}.navbtn.active{background:#4f8168;color:white;border-color:#314d3e}.navbtn span{float:right}.panel{padding:12px;overflow:auto}.panel-head{display:flex;justify-content:space-between;align-items:center}.daytag{background:#d9c98e;padding:5px 8px;border:3px solid #817755;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}.card{background:#fff;border:3px solid #77705c;padding:9px;min-height:92px;position:relative}.card .name{font-weight:900;font-size:13px}.card .meta{font-size:11px;margin:5px 0}.bar{height:9px;background:#ddd1ae;border:2px solid #77705c}.bar i{display:block;height:100%;background:#5a9d76;width:70%}.buy{position:absolute;right:7px;bottom:7px;border:2px solid #405c49;background:#77a988;color:#fff;padding:4px 7px;font-weight:bold;cursor:pointer}.tasks{border-left:4px solid #5d5a4b;padding:10px;background:#f4edda;overflow:auto}.task{border:3px solid #857d63;background:#fffaf0;padding:8px;margin:7px 0;font-size:12px}.task.done{opacity:.55}.task button{margin-top:6px;border:2px solid #665e49;background:#edbe63;padding:4px 6px;font-weight:bold;cursor:pointer}.log{margin-top:8px;padding:7px;background:#3d5147;color:#e8eedc;font-size:11px;height:36px}.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateY(100px);background:#fff3bb;border:4px solid #5d4f36;padding:9px 14px;font-weight:bold;opacity:0;transition:.25s;z-index:20}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:800px){.game{grid-template-rows:56px 44% 1fr}.bottom{grid-template-columns:82px 1fr 210px}.brand h1{font-size:14px}.brand small,.stat:nth-child(3){display:none}.stat{min-width:78px}.cards{grid-template-columns:repeat(2,1fr)}.mentor{left:5%}.thought{width:150px}.store{left:1%;right:1%}}
</style></head>
<body><div class="game">
<header><div class="brand"><div class="logo"><i></i></div><div><h1>MERCADINHO DO SEU ZÉ</h1><small>Dia <span id="day">1</span> • Bairro Aurora</small></div></div><div class="stats"><div class="stat">CAIXA <b id="cash">R$ 1.250</b></div><div class="stat">CLIENTES <b id="clients">24</b></div><div class="stat">REPUTAÇÃO <b id="rep">68%</b></div></div></header>
<section class="scene"><div class="wall"></div><div class="awning"></div><div class="sign">SUPERMERCADO ZÉ</div><div class="store"><div class="backwall"></div><div class="shelf shelf1"><div class="items"><i class="item"></i><i class="item"></i><i class="item"></i></div></div><div class="shelf shelf2"><div class="items"><i class="item"></i><i class="item"></i><i class="item"></i><i class="item"></i></div></div><div class="counter"><div class="register"></div></div><div class="cart"><div class="basket"></div></div></div>
<div class="person mentor"><div class="head"><i class="glasses"></i><i class="face"></i></div><div class="body"><i class="tie"></i><i class="arms"></i></div><div class="legs"></div><div class="thought" id="mentorText">Bem-vindo! Primeiro, vamos organizar o estoque.</div></div>
<div class="person customer"><div class="head"></div><div class="body"></div><div class="legs"></div></div><div class="bubble">Olá, Seu Zé!</div></section>
<div class="bottom"><aside class="sidebar"><h3>Gestão</h3><button class="navbtn active" data-view="Estoque">Estoque <span>▦</span></button><button class="navbtn" data-view="Funcionários">Equipe <span>♟</span></button><button class="navbtn" data-view="Marketing">Vitrine <span>★</span></button><button class="navbtn" data-view="Finanças">Finanças <span>$</span></button></aside>
<main class="panel"><div class="panel-head"><h3 id="panelTitle">COMPRAR ESTOQUE</h3><span class="daytag">DIA <b id="daySmall">1</b></span></div><div class="cards" id="cards"></div><div class="log" id="log">Seu Zé: mantenha os produtos no ponto certo.</div></main>
<aside class="tasks"><h3>Missão do dia</h3><div id="tasks"></div></aside></div></div><div class="toast" id="toast"></div>
<script>
const state={cash:1250,clients:24,rep:68,day:1,stock:{arroz:70,leite:45,feijao:60}};
const stock=[['Arroz 5kg','R$ 18','arroz'],['Leite integral','R$ 4','leite'],['Feijão 1kg','R$ 7','feijao'],['Pão francês','R$ 6','pao'],['Café 500g','R$ 12','cafe'],['Açúcar 1kg','R$ 5','acucar']];
const team=[['Júlia','Caixa','R$ 70/dia'],['Carlos','Repositor','R$ 65/dia'],['Bia','Atendimento','R$ 68/dia']];
const marketing=[['Cartaz de ofertas','+6 reputação','R$ 80'],['Degustação','+12 clientes','R$ 140'],['Promoção de bairro','+15 reputação','R$ 220']];
function money(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function update(){cash.textContent=money(state.cash);clients.text();}
const $=id=>document.getElementByById(id);function sync(){ $('cash').textContent=money(state.cash);$('clients').textContent=state.clients;$('rep').textContent=state.rep+'%';$('day').textContent=state.day;$('daySmall').textContent=state.day }
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function render(view='Estoque'){$('panelTitle').textContent=view==='Estoque'?'COMPRAR ESTOQUE':view==='Funcionários'?'CONTRATAR EQUIPE':view==='Marketing'?'AÇÕES DE MERCADO':'RESUMO FINANCEIRO';let arr=view==='Estoque'?stock:view==='Funcionários'?team:marketing; if(view==='Finanças'){ $('cards').innerHTML=`<div class="card"><div class="name">Faturamento do dia</div><div class="meta">${money(state.clients*8)}</div></div><div class="card"><div class="name">Lucro estimado</div><div class="meta">${money(state.clients*3)}</div></div><div class="card"><div class="name">Caixa disponível</div><div class="meta">${money(state.cash)}</div></div>`;return}$('cards').innerHTML=arr.map((a,i)=>`<div class="card"><div class="name">${a[0]}</div><div class="meta">${a[1]}${view==='Estoque'?' • unidade':''}</div>${view==='Estoque'?'<div class="bar"><i style="width:'+([70,45,60,38,82,55][i])+'%"></i></div>':''}<button class="buy" data-i="${i}">${view==='Estoque'?'COMPRAR':view==='Funcionários'?'CONTRATAR':'APLICAR'}</button></div>`).join('');}
const originalTasks=['Reposicionar 3 produtos','Atender 12 clientes','Fechar o caixa'];let done=[false,false,false];function tasks(){ $('tasks').innerHTML=originalTasks.map((t,i)=>`<div class="task ${done[i]?'done':''}"><b>${i+1}. ${t}</b><br>${done[i]?'Concluída':'Recompensa: R$ 25'}<br>${done[i]?'<span>✓</span>':'<button data-task="'+i+'">Fazer</button>'}</div>`).join('')}tasks();render();
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.view)});
$('cards').onclick=e=>{if(!e.target.matches('.buy'))return;let view=document.querySelector('.navbtn.active').dataset.view,i=+e.target.dataset.i;if(view==='Estoque'){let cost=parseFloat(stock[i][1].replace('R$ ',''));if(state.cash<cost)return toast('Caixa insuficiente!');state.cash-=cost;state.stock[stock[i][2]]=(state.stock[stock[i][2]]||0)+20;state.rep=Math.min(100,state.rep+1);$('mentorText').textContent=['Boa reposição! Estoque vazio afasta clientes.','Produtos bem posicionados vendem mais!','Observe o caixa antes de comprar em excesso.'][i%3];$('log').textContent='Compra realizada: '+stock[i][0];toast('Estoque atualizado');}else if(view==='Funcionários'){state.cash-=70;state.rep=Math.min(100,state.rep+3);$('mentorText').textContent='Equipe treinada atende melhor e vende mais!';toast(team[i][0]+' entrou para a equipe')}else{let cost=[80,140,220][i];if(state.cash<cost)return toast('Caixa insuficiente!');state.cash-=cost;state.clients+=i===1?12:i===2?5:3;state.rep=Math.min(100,state.rep+(i===1?12:i===2?15:6));$('mentorText').textContent='Uma boa ação aproxima o mercado da vizinhança!';toast('Ação aplicada') }sync();render(view)};
$('tasks').onclick=e=>{if(!e.target.matches('button'))return;let i=+e.target.dataset.task;if(done[i])return;done[i]=true;state.cash+=25;if(i===0){state.rep=Math.min(100,state.rep+4);$('mentorText').textContent='Excelente! Prateleiras cheias passam confiança.'}if(i===1){state.clients+=8;$('mentorText').textContent='Atender bem faz o cliente voltar amanhã.'}if(i===2){state.rep=Math.min(100,state.rep+2);$('mentorText').textContent='Fechar o caixa com disciplina evita prejuízos.'}$('log').textContent='Missão concluída: '+originalTasks[i];sync();tasks();toast('Missão concluída +R$ 25')};
setInterval(()=>{if(state.clients>0){state.cash+=state.clients*0.35;state.rep=Math.max(0,state.rep-.05);sync()}},4000);
</script></body></html>
